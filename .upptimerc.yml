# ==========================================================
# CoproZen — Upptime
# Monitoring et page publique de statut
# ==========================================================

owner: coprozen-ma
repo: upptime

# User-Agent envoyé aux services surveillés.
# Utile pour identifier les contrôles dans les journaux serveur/WAF.
user-agent: CoproZen-Status-Monitor/1.0

# ==========================================================
# Services surveillés
# ==========================================================
sites:
  - name: Site public CoproZen
    slug: site-institutionnel
    url: https://www.coprozen.ma
    icon: https://www.coprozen.ma/favicon.ico
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200

  - name: Espace de connexion CoproZen
    slug: application-coprozen
    url: https://www.coprozen.ma/auth/login
    icon: https://www.coprozen.ma/favicon.ico
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200

  - name: Services applicatifs CoproZen
    slug: api-coprozen
    url: https://api.coprozen.ma/health/ready
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200
# ==========================================================
# Attribution des incidents
# ==========================================================

assignees:
  - saadamine
  - kadda-Tarek

# Les incidents restent dans GitHub Issues afin de conserver
# un historique consultable.
skipDeleteIssues: true

# ==========================================================
# Page publique
# ==========================================================

status-website:
  cname: status.coprozen.ma

  name: Statut CoproZen

  logoUrl: https://www.coprozen.ma/coprozen_logo_with_text.png
  favicon: https://coprozen.ma/favicon.ico

  # Le fichier doit exister dans :
  # assets/coprozen-theme.css
  #
  # Upptime publie automatiquement les fichiers du dossier assets
  # à la racine du site.
  themeUrl: https://status.coprozen.ma/coprozen-theme.css

  introTitle: "Disponibilité des services **CoproZen**"

  introMessage: >
    Vérifiez ici si CoproZen rencontre un incident général.
    Si tous les services sont disponibles mais que votre problème persiste,
    contactez le support : il peut être lié à votre compte ou à vos droits.

  navbar:
    - title: Statut
      href: /

    - title: Accueil CoproZen
      href: https://www.coprozen.ma

    - title: Se connecter
      href: https://www.coprozen.ma/auth/login

    - title: Support
      href: mailto:support@coprozen.ma

  metaTags:
    - name: description
      content: Vérifiez la disponibilité des services CoproZen et les incidents en cours.

    - name: robots
      content: index, follow

    - name: theme-color
      content: "#00a9e7"

  customHeadHtml: |
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Disponibilité des services CoproZen">
    <meta property="og:description" content="Vérifiez la disponibilité des services CoproZen et les incidents en cours.">
    <meta property="og:url" content="https://status.coprozen.ma">
    <meta property="og:image" content="https://www.coprozen.ma/coprozen_logo_with_text.png">

  customFootHtml: |
    <div class="coprozen-status-note">
      Les contrôles sont automatiques et ne consultent aucune donnée personnelle
      ni information liée à votre copropriété.
    </div>

# ==========================================================
# Internationalisation française
# ==========================================================

i18n:
  activeIncidents: Incident général en cours
  allSystemsOperational: Tous les services CoproZen fonctionnent normalement
  incidentReport: "Incident n°$NUMBER"
  activeIncidentSummary: Ouvert le $DATE avec $POSTS mises à jour
  incidentTitle: Détails de l’incident $NUMBER
  incidentDetails: Informations sur l’incident
  incidentFixed: Incident résolu
  incidentOngoing: Résolution en cours
  incidentOpenedAt: Ouvert le
  incidentClosedAt: Résolu le
  incidentViewOnGitHub: Consulter le suivi de l’incident
  incidentCommentSummary: Publié le $DATE par $AUTHOR
  pastIncidents: Historique des incidents
  pastIncidentsResolved: Résolu en $MINUTES minutes avec $POSTS mises à jour
  liveStatus: Disponibilité actuelle
  overallUptime: "Disponibilité globale : $UPTIME"
  overallUptimeTitle: Disponibilité globale
  averageResponseTime: "Délai de réponse moyen : $TIME ms"
  averageResponseTimeTitle: Délai de réponse moyen
  sevelDayResponseTime: Délai de réponse sur 7 jours
  responseTimeMs: Délai de réponse en millisecondes
  up: Disponible
  down: Incident en cours
  degraded: Service ralenti
  ms: ms
  loading: Chargement de l’état des services
  navGitHub: GitHub
  footer: © CoproZen — État des services
  rateLimitExceededTitle: Limite de consultation atteinte
  rateLimitExceededIntro: >
    Les données temporaires ne peuvent pas être chargées immédiatement.
    Veuillez réessayer dans quelques minutes.
  rateLimitExceededWhatDoesErrorMean: Pourquoi ce message apparaît-il ?
  rateLimitExceededErrorMeaning: >
    La limite de consultation de l’API GitHub a été temporairement atteinte.
    La surveillance des services continue normalement en arrière-plan.
  rateLimitExceededErrorHowCanFix: Que faire ?
  rateLimitExceededErrorFix: >
    Actualisez cette page dans quelques minutes. Aucun accès ou jeton personnel
    n’est nécessaire pour consulter la page de statut.

# ==========================================================
# Planification des workflows
# Les horaires utilisent UTC.
# ==========================================================

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 */6 * * *"
  graphs: "0 0 * * *"
  summary: "0 1 * * *"
  staticSite: "0 2 * * *"
  updates: "0 3 * * *"

# ==========================================================
# Messages de commit générés par Upptime
# ==========================================================

commitMessages:
  commitAuthorName: CoproZen Monitoring
  commitAuthorEmail: support@coprozen.ma

  repoConfig: "chore: mise à jour de la configuration"
  readmeContent: "docs: mise à jour de l’état des services"
  summaryJson: "data: mise à jour du résumé"
  # Upptime analyse ce format pour calculer le statut et le temps de réponse.
  # Conserver $PREFIX et la séquence exacte `in $RESPONSE_TIME ms`.
  statusChange: "$PREFIX $SITE_NAME est $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: "data: mise à jour des graphiques"
  responseTime: "perf: mise à jour du temps de réponse de $SITE_NAME"
  staticSite: "site: reconstruction de la page de statut"
