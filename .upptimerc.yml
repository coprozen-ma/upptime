owner: coprozen-ma
repo: upptime

user-agent: coprozen-status-monitor

sites:
  # Domaine principal.
  # Les codes 301 et 302 sont acceptés au cas où le domaine
  # redirige automatiquement vers www.coprozen.ma.
  - name: Site CoproZen
    slug: site-coprozen
    url: https://coprozen.ma
    icon: https://coprozen.ma/favicon.ico
    maxResponseTime: 10000
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 307
      - 308

  # Site institutionnel avec www.
  - name: Site institutionnel
    slug: site-institutionnel
    url: https://www.coprozen.ma
    icon: https://www.coprozen.ma/favicon.ico
    maxResponseTime: 10000
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 307
      - 308

  # Application métier.
  # Les redirections vers une page de connexion sont normales.
  - name: Application CoproZen
    slug: application-coprozen
    url: https://app.coprozen.ma
    icon: https://coprozen.ma/favicon.ico
    maxResponseTime: 12000
    expectedStatusCodes:
      - 200
      - 301
      - 302
      - 303
      - 307
      - 308

  # API publique.
  # L'endpoint /health doit être accessible sans authentification.
  - name: API CoproZen
    slug: api-coprozen
    url: https://api.coprozen.ma/health
    icon: https://coprozen.ma/favicon.ico
    maxResponseTime: 8000
    expectedStatusCodes:
      - 200

status-website:
  cname: status.coprozen.ma

  name: État des services Coprozen
  logoUrl: https://coprozen.ma/logo.png
  favicon: https://coprozen.ma/favicon.ico

  themeUrl: https://status.coprozen.ma/coprozen-theme.css

  introTitle: "État des services **Coprozen**"
  introMessage: >
    Consultez en temps réel la disponibilité de nos services.
    Cette page est automatiquement mise à jour lorsqu’un incident
    ou une opération de maintenance affecte la plateforme.

  navbar:
    - title: Statut
      href: /

    - title: Application
      href: https://app.coprozen.ma

    - title: Site Coprozen
      href: https://coprozen.ma

    - title: Support
      href: https://coprozen.ma/contact

  metaTags:
    - name: robots
      content: index, follow

    - name: description
      content: État en temps réel des services, applications et API Coprozen.

    - property: og:title
      content: État des services Coprozen

    - property: og:description
      content: Consultez la disponibilité en temps réel des services Coprozen.

    - property: og:type
      content: website

    - property: og:url
      content: https://status.coprozen.ma

    - property: og:image
      content: https://coprozen.ma/status-preview.png

  customHeadHtml: |
    <meta name="theme-color" content="#07111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 */6 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updates: "0 3 * * *"

commitMessages:
  commitAuthorName: Coprozen Status Bot
  commitAuthorEmail: status@coprozen.ma

  readmeContent: "docs: update service availability"
  summaryJson: "data: update status summary"
  statusChange: "status: update $SITE_NAME"
  graphsUpdate: "data: update response-time graphs"
  commitPrefixStatus: "🟢"
  commitPrefixStatusDown: "🔴"
  commitPrefixStatusMaintenance: "🟡"

skipDeleteIssues: true
